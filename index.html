<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dock Tracker REC1/REC3 v8.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid #ff9900;margin-bottom:16px;flex-wrap:wrap;gap:8px}
header h1{font-size:1.5rem;color:#fff}
header h1 span.v{color:#ff9900;font-size:.9rem}
.hdr-r{display:flex;align-items:center;gap:12px}
.by{color:#ff9900;font-size:.9rem;font-weight:600}
select{background:#232f3e;color:#e0e0e0;border:1px solid #ff9900;padding:6px 12px;border-radius:6px;font-size:.9rem;cursor:pointer}
select:focus{outline:none;border-color:#ffb84d}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:600;background:#232f3e;color:#999;border:1px solid #333;transition:all .2s;user-select:none}
.tab:hover{color:#fff;border-color:#666}
.tab.active{background:#ff9900;color:#1a1a2e;border-color:#ff9900}
.panel{display:none}.panel.active{display:block}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#232f3e;border-radius:8px;padding:14px;border-left:4px solid #ff9900}
.kpi.g{border-left-color:#4caf50}.kpi.b{border-left-color:#42a5f5}
.kpi.p{border-left-color:#ab47bc}.kpi.r{border-left-color:#ef5350}
.kpi .val{font-size:1.5rem;font-weight:700;color:#fff}
.kpi .lbl{font-size:.72rem;color:#999;margin-top:2px}

/* TABLES */
.stbl{overflow-x:auto;max-height:75vh;overflow-y:auto;margin-bottom:16px;border-radius:8px;border:1px solid #1f2937}
table{width:100%;border-collapse:collapse;font-size:.78rem}
thead th{background:#16213e;color:#ff9900;padding:8px 6px;text-align:left;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2;white-space:nowrap;border-bottom:2px solid #ff9900}
thead th:hover{background:#1a2744}
td{padding:6px;border-bottom:1px solid #1f2937;white-space:nowrap}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
tbody tr:hover{background:rgba(255,153,0,.06)}
.exp-toggle{cursor:pointer;font-size:.85rem;width:24px;text-align:center;user-select:none}

/* BADGES */
.badge{padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600;display:inline-block}
.st-CLOSED{background:#1b5e20;color:#a5d6a7}
.st-ARRIVED{background:#e65100;color:#ffcc80}
.st-ARRIVAL_SCHEDULED{background:#4a148c;color:#ce93d8}
.st-CHECK_IN{background:#0d47a1;color:#90caf9}
.po-Pontual{background:#1b5e20;color:#a5d6a7}
.po-Atraso\ motorista{background:#b71c1c;color:#ef9a9a}
.po-Atraso\ doca{background:#e65100;color:#ffcc80}
.po-Atraso\ processamento{background:#f9a825;color:#1a1a2e}

/* EXPAND ROW */
.xrow{display:none;background:#13192a}
.xrow.open{display:table-row}
.xrow td{padding:10px 16px}
.xcard{background:#1a2232;border-radius:8px;padding:12px;border:1px solid #2a3444}
.xcard h4{color:#ff9900;font-size:.82rem;margin-bottom:8px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin-top:8px}
.xitem{background:#232f3e;padding:6px 8px;border-radius:4px;font-size:.72rem;display:flex;gap:6px;align-items:center}
.xitem img{width:32px;height:32px;object-fit:contain;border-radius:3px;background:#fff;flex-shrink:0}
.xmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.xm{font-size:.75rem}.xm b{color:#ff9900;display:block;font-size:.68rem;margin-bottom:2px}
.no-sort{color:#555;font-style:italic;font-size:.75rem;padding:4px 0}
.obs-input{background:#232f3e;border:1px solid #333;color:#e0e0e0;padding:4px 8px;border-radius:4px;font-size:.72rem;width:100%}
.obs-input:focus{border-color:#ff9900;outline:none}

/* DAY SECTIONS */
.dhdr{background:#16213e;padding:10px 14px;border-radius:8px;margin-bottom:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #ff9900;user-select:none}
.dhdr:hover{background:#1a2744}
.dhdr .dt{font-weight:700;color:#ff9900;font-size:.9rem}
.dhdr .info{color:#999;font-size:.78rem}
.dbody{display:none;margin-bottom:10px}.dbody.open{display:block}

/* BAR CHART */
.barw{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.barlbl{width:140px;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex-shrink:0}
.bar{height:20px;background:linear-gradient(90deg,#ff9900,#ffb84d);border-radius:4px;min-width:2px;transition:width .3s}
.barval{font-size:.72rem;color:#999;min-width:50px}

/* BUTTONS */
.btn{background:#ff9900;color:#1a1a2e;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.8rem;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#ffb84d}.btn:active{transform:scale(.97)}
.btn-sec{background:#232f3e;color:#ff9900;border:1px solid #ff9900}
.btn-sec:hover{background:#2a3848}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-box{background:#232f3e;border:1px solid #333;color:#e0e0e0;padding:6px 12px;border-radius:6px;font-size:.82rem;width:280px}
.search-box:focus{border-color:#ff9900;outline:none}

/* EOS */
.eos-blk{background:#232f3e;border-radius:8px;padding:14px;margin-bottom:12px}
.eos-blk h3{color:#ff9900;margin-bottom:8px;font-size:.92rem}

/* Section header for tab content */
.sec-title{color:#ff9900;margin:14px 0 8px;font-size:.92rem;font-weight:600}


/* Column Filter Dropdowns */
.col-filter-btn{cursor:pointer;font-size:.6rem;margin-left:3px;opacity:.6;vertical-align:middle}
.col-filter-btn:hover{opacity:1}
.col-filter-popup{position:absolute;background:#1a2232;border:1px solid #ff9900;border-radius:6px;padding:8px;z-index:100;max-height:240px;overflow-y:auto;min-width:160px;font-size:.72rem}
.col-filter-popup label{display:block;padding:2px 0;cursor:pointer;color:#ccc}
.col-filter-popup label:hover{color:#fff}
.col-filter-popup input[type=checkbox]{margin-right:6px}
.col-filter-actions{display:flex;gap:8px;margin-bottom:6px;border-bottom:1px solid #333;padding-bottom:4px}
.col-filter-actions span{cursor:pointer;color:#ff9900;font-size:.68rem}
.col-filter-actions span:hover{text-decoration:underline}

/* Config tab */
.cfg-section{background:#232f3e;border-radius:8px;padding:14px;margin-bottom:12px}
.cfg-section h3{color:#ff9900;margin-bottom:10px;font-size:.92rem}
.cfg-row{display:flex;gap:12px;align-items:center;margin-bottom:8px;font-size:.78rem}
.cfg-row label{width:100px;color:#999}
.cfg-row input[type=time]{background:#1a1a2e;border:1px solid #333;color:#e0e0e0;padding:4px 8px;border-radius:4px;font-size:.78rem}
.cfg-row input[type=time]:focus{border-color:#ff9900;outline:none}
.sort-arrow{font-size:.6rem;margin-left:2px;color:#ff9900}


/* v7.3 NEW STYLES */

/* Refresh indicator */
.refresh-bar{display:flex;align-items:center;gap:8px;font-size:.72rem;color:#999}
.refresh-bar .live-badge{background:#1b5e20;color:#a5d6a7;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600}
.refresh-bar .paused-badge{background:#333;color:#999;padding:2px 8px;border-radius:10px;font-size:.65rem}
.refresh-bar .countdown{color:#666;font-size:.68rem}
.btn-refresh{background:#232f3e;color:#ff9900;border:1px solid #ff9900;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.78rem}
.btn-refresh:hover{background:#ff9900;color:#1a1a2e}

/* No-show alert */
@keyframes pulse-red{0%,100%{box-shadow:0 0 4px #ef5350}50%{box-shadow:0 0 16px #ef5350}}
.noshow-alert{background:#2d1111;border:1px solid #ef5350;border-radius:8px;padding:10px 14px;margin-bottom:12px;animation:pulse-red 2s infinite;display:flex;align-items:center;gap:10px}
.noshow-alert .icon{font-size:1.4rem}.noshow-alert .count{font-size:1.2rem;font-weight:700;color:#ef5350}
.noshow-badge{background:#b71c1c;color:#ffcdd2;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700;animation:pulse-red 2s infinite}
.noshow-late{color:#ef5350;font-size:.68rem;font-weight:600}

/* Vendor Score */
.vs-A{background:#1b5e20;color:#a5d6a7;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.vs-B{background:#2e7d32;color:#c8e6c9;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.vs-C{background:#f9a825;color:#1a1a2e;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.vs-D{background:#e65100;color:#ffe0b2;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.vs-E{background:#c62828;color:#ffcdd2;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.vs-F{background:#b71c1c;color:#fff;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:60px repeat(3,1fr);gap:2px;margin:12px 0;font-size:.7rem}
.hm-header{background:#16213e;color:#ff9900;padding:6px;text-align:center;font-weight:600;border-radius:3px}
.hm-label{background:#16213e;color:#ccc;padding:6px;text-align:center;border-radius:3px}
.hm-cell{padding:6px;text-align:center;border-radius:3px;color:#fff;font-weight:600}

/* Gantt timeline */
.gantt-wrap{position:relative;background:#16213e;border-radius:8px;padding:12px;margin:12px 0;overflow-x:auto}
.gantt-row{display:flex;align-items:center;height:24px;margin:2px 0;position:relative}
.gantt-label{width:100px;font-size:.68rem;color:#ccc;flex-shrink:0;text-align:right;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-track{flex:1;position:relative;height:18px;background:rgba(255,255,255,.03);border-radius:3px}
.gantt-bar{position:absolute;top:1px;height:16px;border-radius:3px;font-size:.58rem;color:#fff;line-height:16px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:1;opacity:.9}
.gantt-now{position:absolute;top:0;bottom:0;width:2px;background:#ff9900;z-index:5}
.gantt-hours{display:flex;justify-content:space-between;font-size:.6rem;color:#666;padding:0 0 0 100px}

/* Handoff */
.handoff-box{background:#1a2232;border:1px solid #ff9900;border-radius:8px;padding:14px;margin:12px 0;font-size:.78rem;white-space:pre-wrap;line-height:1.6;max-height:60vh;overflow-y:auto}

/* Flag */
.flag-btn{cursor:pointer;font-size:.7rem;opacity:.5;user-select:none}.flag-btn:hover{opacity:1}
.flag-btn.flagged{opacity:1;color:#ef5350}
.flag-popup{position:fixed;background:#1a2232;border:1px solid #ff9900;border-radius:8px;padding:14px;z-index:200;width:260px;font-size:.78rem}
.flag-popup label{display:block;padding:3px 0;cursor:pointer;color:#ccc}
.flag-popup label:hover{color:#fff}
.flag-popup input[type=radio]{margin-right:6px}
.flag-popup textarea{background:#232f3e;border:1px solid #333;color:#e0e0e0;width:100%;padding:6px;border-radius:4px;font-size:.72rem;margin-top:6px;resize:vertical;height:50px}

/* WoW comparison */
.wow-table{width:100%;border-collapse:collapse;font-size:.78rem;margin:8px 0}
.wow-table th{background:#16213e;color:#ff9900;padding:8px;text-align:left;border-bottom:1px solid #333}
.wow-table td{padding:8px;border-bottom:1px solid #1f2937}
.delta-pos{color:#4caf50;font-weight:600}.delta-neg{color:#ef5350;font-weight:600}
.delta-neutral{color:#999}

/* Progress bar */
.pbar-wrap{background:#1f2937;border-radius:10px;height:12px;overflow:hidden;margin:4px 0}
.pbar{height:100%;border-radius:10px;transition:width .3s}

/* AI Chat */
.ai-container{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:400px}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:.82rem;line-height:1.5}
.ai-msg.user{background:#ff9900;color:#1a1a2e;align-self:flex-end;border-bottom-right-radius:4px}
.ai-msg.bot{background:#232f3e;color:#e0e0e0;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
.ai-msg table{width:100%;margin:6px 0;border-collapse:collapse;font-size:.72rem}
.ai-msg table th{background:#16213e;color:#ff9900;padding:4px 6px;text-align:left}
.ai-msg table td{padding:4px 6px;border-bottom:1px solid #1f2937}
.ai-msg b{color:#ff9900}
.ai-quick{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.ai-qbtn{background:#232f3e;color:#ff9900;border:1px solid #333;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:.72rem}
.ai-qbtn:hover{background:#2a3848;border-color:#ff9900}
.ai-input-wrap{display:flex;gap:8px;padding:8px 12px;background:#16213e;border-radius:0 0 8px 8px}
.ai-input{flex:1;background:#232f3e;border:1px solid #333;color:#e0e0e0;padding:10px 14px;border-radius:20px;font-size:.82rem}
.ai-input:focus{border-color:#ff9900;outline:none}
.ai-send{background:#ff9900;color:#1a1a2e;border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-weight:700;font-size:.85rem}
.ai-send:hover{background:#ffb84d}


/* ─── v7.4 ADDITIONS ─── */

/* Search box for all tables */
.tbl-search{background:#1a2232;color:#e0e0e0;border:1px solid #333;padding:6px 10px;border-radius:6px;font-size:.78rem;width:240px;margin:4px 0}
.tbl-search:focus{border-color:#ff9900;outline:none}
.tbl-search::placeholder{color:#666}

/* Sort indicators */
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:#1a2232;color:#ffb84d}
thead th .sort-arrow{font-size:.65rem;margin-left:3px;color:#ff9900}

/* Redesigned ISA detail panel */
.xcard-detail{background:#1a2232;border-radius:8px;padding:16px;margin:8px 0;border:1px solid #2a3a52}
.xcard-detail h4{color:#ff9900;margin-bottom:12px;font-size:.95rem}
.xmeta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.xmeta-grid .xm{background:#16213e;border-radius:6px;padding:8px 10px}
.xmeta-grid .xm b{display:block;font-size:.65rem;color:#999;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.xmeta-grid .xm span{font-size:.82rem;color:#e0e0e0}

/* Editable fields grid */
.edit-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;padding:12px;background:#0d1520;border-radius:8px;border:1px solid #1f2937}
.edit-fields .field-group{display:flex;flex-direction:column;gap:3px}
.edit-fields .field-group.wide{grid-column:span 2}
.edit-fields .field-group label{font-size:.68rem;color:#ff9900;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.edit-fields .field-group input,
.edit-fields .field-group select,
.edit-fields .field-group textarea{background:#1a2232;color:#e0e0e0;border:1px solid #333;padding:6px 8px;border-radius:4px;font-size:.8rem;font-family:inherit}
.edit-fields .field-group input:focus,
.edit-fields .field-group select:focus,
.edit-fields .field-group textarea:focus{border-color:#ff9900;outline:none}
.edit-fields .field-group textarea{resize:vertical;min-height:42px}

/* FAB (Floating Action Button) */
.ai-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff9900,#e88600);color:#1a1a2e;font-size:1.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(255,153,0,.4);z-index:9999;border:none;transition:transform .2s,box-shadow .2s;user-select:none}
.ai-fab:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(255,153,0,.6)}
.ai-fab.has-alert{animation:fabPulse 2s infinite}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 16px rgba(255,153,0,.4)}50%{box-shadow:0 4px 24px rgba(255,153,0,.8)}}

/* Draggable AI Chat Window */
.ai-float{position:fixed;bottom:90px;right:24px;width:380px;height:520px;background:#1a1a2e;border:1px solid #ff9900;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:10000;display:none;flex-direction:column;overflow:hidden;resize:both;min-width:300px;min-height:350px}
.ai-float.open{display:flex}
.ai-float-header{background:#232f3e;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;border-bottom:1px solid #ff9900;flex-shrink:0}
.ai-float-header .title{color:#ff9900;font-weight:700;font-size:.85rem}
.ai-float-header .controls{display:flex;gap:8px}
.ai-float-header .controls span{cursor:pointer;font-size:1rem;opacity:.7;transition:opacity .2s}
.ai-float-header .controls span:hover{opacity:1}
.ai-float .ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai-float .ai-quick{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;border-top:1px solid #1f2937;flex-shrink:0}
.ai-float .ai-qbtn{font-size:.68rem;padding:4px 8px;background:#232f3e;color:#ff9900;border-radius:12px;cursor:pointer;border:1px solid #333;transition:all .2s}
.ai-float .ai-qbtn:hover{background:#ff9900;color:#1a1a2e}
.ai-float .ai-input-wrap{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #1f2937;flex-shrink:0}
.ai-float .ai-input{flex:1;background:#232f3e;color:#e0e0e0;border:1px solid #333;padding:8px 10px;border-radius:6px;font-size:.82rem}
.ai-float .ai-input:focus{border-color:#ff9900;outline:none}
.ai-float .ai-send{background:#ff9900;color:#1a1a2e;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:.82rem}
.ai-float .ai-send:hover{background:#ffb84d}



/* ─── KPI Summary Cards ─── */
.kpi-strip{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:140px;background:linear-gradient(135deg,#232f3e,#2a3a4e);border:1px solid #334155;border-radius:10px;padding:14px 16px;text-align:center;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:10px 0 0 10px}
.kpi-card.c1::before{background:#ff9900}
.kpi-card.c2::before{background:#3b82f6}
.kpi-card.c3::before{background:#10b981}
.kpi-card.c4::before{background:#8b5cf6}
.kpi-card.c5::before{background:#ef4444}
.kpi-val{font-size:1.6rem;font-weight:800;color:#fff;line-height:1.2}
.kpi-label{font-size:.72rem;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.kpi-sparkline{margin-top:6px}
.kpi-sparkline svg{width:100%;height:28px}
.kpi-sparkline polyline{fill:none;stroke:#ff9900;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.kpi-sparkline circle{fill:#ff9900;r:2.5}

/* ─── Date Filter ─── */
.date-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.date-filter-bar label{color:#94a3b8;font-size:.78rem}
.date-filter-bar input[type="date"]{background:#232f3e;color:#e0e0e0;border:1px solid #475569;padding:5px 8px;border-radius:6px;font-size:.78rem;cursor:pointer}
.date-filter-bar input[type="date"]:focus{border-color:#ff9900;outline:none}
.date-filter-bar .btn-sm{background:#334155;color:#e0e0e0;border:1px solid #475569;padding:5px 12px;border-radius:6px;font-size:.75rem;cursor:pointer}
.date-filter-bar .btn-sm:hover{background:#475569}

/* ─── Dark/Light Mode Toggle ─── */
.theme-toggle{background:none;border:1px solid #475569;border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.theme-toggle:hover{border-color:#ff9900}

/* ─── Light Mode ─── */
body.light-mode{background:#f0f2f5;color:#1e293b}
body.light-mode .wrap{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-top:8px}
body.light-mode header{border-bottom-color:#ff9900}
body.light-mode header h1{color:#1e293b}
body.light-mode .tabs .tab{background:#e2e8f0;color:#475569}

<script>
window.onerror=function(m,u,l){console.warn("DT:",m,"L"+l);return true};

var D=[];
var S=[];
// ════════════════════════════════════════════════════════════════
//  DOCK TRACKER v8.0 — DATA LOADER (GitHub Pages)
//  Carrega D[] e S[] de data/latest.json (commitado pelo TM)
// ════════════════════════════════════════════════════════════════

var _dtLoaded = false;
var _dtLoadCount = 0;

async function loadData() {
    var cfg = window.DT_CONFIG || {};
    var dataUrl = cfg.DATA_URL || 'data/latest.json';
    var fcParam = new URLSearchParams(window.location.search).get('fc');
    var fc = fcParam || cfg.FC_DEFAULT || FC || 'REC1';

    _showLoadMsg('🔄 Carregando dados...', '#58a6ff');

    try {
        // Cache-bust para pegar versão mais recente
        var url = dataUrl + '?t=' + Date.now();
        var res = await fetch(url);

        if (!res.ok) {
            if (res.status === 404) {
                _showLoadMsg('📭 Sem dados ainda. Abra o Dockmaster com o TM ativo.', '#f0883e');
                return;
            }
            throw new Error('HTTP ' + res.status);
        }

        var json = await res.json();

        // Setar arrays globais
        D = json.appointments || json.D || [];
        S = json.sortability || json.S || [];

        // Filtrar por FC se necessário
        if (fcParam) {
            D = D.filter(function(a) { return a.fc === fc; });
            S = S.filter(function(s) { return s.fc === fc; });
            FC = fc;
        }

        // Reconstruir sMap
        if (typeof sMap !== 'undefined') {
            sMap = {};
            S.forEach(function(s) {
                if (s.i && s.items) sMap[s.i] = s.items;
            });
        }

        _dtLoaded = true;
        _dtLoadCount++;

        var lastSync = json.lastSync || 'desconhecido';
        if (json.lastSync) {
            try { lastSync = new Date(json.lastSync).toLocaleString('pt-BR'); } catch(e) {}
        }

        console.log('[DT-Loader] ✅ D=' + D.length + ' appts, S=' + S.length + ' sort');

        _showLoadMsg(
            '✅ ' + D.length + ' agendamentos, ' + S.length + ' sort • ' +
            'Sync: ' + lastSync + ' • FC: ' + (FC || 'ALL'),
            '#3fb950'
        );

        try { render(); } catch(e) { console.error('[DT-Loader] render():', e); }

    } catch (err) {
        console.error('[DT-Loader] ❌', err);
        _showLoadMsg(
            '⚠️ Erro: ' + err.message +
            (_dtLoaded ? ' (usando dados em cache)' : ''),
            '#f85149'
        );
    }
}

function _showLoadMsg(msg, color) {
    var el = document.getElementById('dt-load-status');
    if (!el) {
        el = document.createElement('div');
        el.id = 'dt-load-status';
        el.style.cssText =
            'padding:6px 16px;font-size:12px;text-align:center;' +
            'background:rgba(0,0,0,0.3);border-bottom:1px solid #30363d;';
        var body = document.body;
        if (body.firstChild) body.insertBefore(el, body.firstChild);
        else body.appendChild(el);
    }
    el.textContent = msg;
    el.style.color = color || '#8b949e';
}

(function _initDataLoader() {
    var cfg = window.DT_CONFIG || {};
    var refreshMs = cfg.REFRESH_MS || 300000;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadData, 100);
        });
    } else {
        setTimeout(loadData, 100);
    }

    setInterval(function() {
        loadData().catch(function(e) {
            console.warn('[DT-Loader] Refresh error:', e);
        });
    }, refreshMs);
})();

// ════════════════════════════════════════════════════════════════

var _dtLoaded = false;
var _dtLoadCount = 0;

/**
 * Carrega D[] e S[] da API e dispara render().
 * Chamada na inicialização e a cada REFRESH_MS.
 */
async function loadData() {
    var cfg = window.DT_CONFIG || {};
    var apiBase = cfg.API_BASE || '';
    var fcParam = new URLSearchParams(window.location.search).get('fc');
    var fc = fcParam || cfg.FC_DEFAULT || FC || 'REC1';
    var days = cfg.DAYS_HISTORY || 14;

    // Se API_BASE não configurado, usar dados locais (modo offline)
    if (!apiBase || apiBase.indexOf('PLACEHOLDER') >= 0) {
        console.warn('[DT-Loader] API_BASE não configurado. Modo offline.');
        if (!_dtLoaded) {
            _showLoadMsg('⚠️ API não configurada. Rode deploy.sh primeiro.', '#f0883e');
        }
        return;
    }

    _showLoadMsg('🔄 Carregando dados...', '#58a6ff');

    try {
        var url = apiBase + '/data?fc=' + fc + '&days=' + days;
        var res = await fetch(url, { credentials: 'include' });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        var json = await res.json();

        // Setar arrays globais (mesmo formato do v7.5)
        D = json.appointments || [];
        S = json.sortability || [];

        // Atualizar FC global se necessário
        if (fcParam) FC = fc;

        // Reconstruir sMap (mapa ISA → items de sortability)
        if (typeof sMap !== 'undefined') {
            sMap = {};
            S.forEach(function(s) {
                if (s.i && s.items) sMap[s.i] = s.items;
            });
        }

        _dtLoaded = true;
        _dtLoadCount++;

        console.log(
            '[DT-Loader] ✅ D=' + D.length + ' appts, S=' + S.length +
            ' sort (' + fc + ', ' + (json.dateRange||{}).from + ' → ' +
            (json.dateRange||{}).to + ')'
        );

        // Atualizar status no header
        var lastCol = json.lastCollected || 'never';
        if (lastCol !== 'never') {
            var d = new Date(lastCol);
            lastCol = d.toLocaleString('pt-BR');
        }
        _showLoadMsg(
            '☁️ API: ' + D.length + ' appts, ' + S.length + ' sort • ' +
            'Última coleta: ' + lastCol,
            '#3fb950'
        );

        // Disparar re-render
        try { render(); } catch(e) { console.error('[DT-Loader] render():', e); }

    } catch (err) {
        console.error('[DT-Loader] ❌', err);
        _showLoadMsg(
            '⚠️ Erro ao carregar: ' + err.message +
            (_dtLoaded ? ' (usando dados em cache)' : ''),
            '#f85149'
        );
    }
}

/**
 * Mostra mensagem de status no topo do dashboard.
 */
function _showLoadMsg(msg, color) {
    var el = document.getElementById('dt-load-status');
    if (!el) {
        el = document.createElement('div');
        el.id = 'dt-load-status';
        el.style.cssText =
            'padding:6px 16px;font-size:12px;text-align:center;' +
            'background:rgba(0,0,0,0.3);border-bottom:1px solid #30363d;';
        var body = document.body;
        if (body.firstChild) body.insertBefore(el, body.firstChild);
        else body.appendChild(el);
    }
    el.textContent = msg;
    el.style.color = color || '#8b949e';
}

// ── Auto-refresh ──
(function _initDataLoader() {
    var cfg = window.DT_CONFIG || {};
    var refreshMs = cfg.REFRESH_MS || 300000;

    // Carregar dados quando DOM estiver pronto
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadData, 100);
        });
    } else {
        setTimeout(loadData, 100);
    }

    // Auto-refresh
    setInterval(function() {
        loadData().catch(function(e) {
            console.warn('[DT-Loader] Auto-refresh error:', e);
        });
    }, refreshMs);
})();

// ════════════════════════════════════════════════════════════════


var FC='REC1';
var curTab=0;
var sMap={};
S.forEach(function(r){sMap[r.i]=r.items||[];});


/* ─── v8.0: GL helper ─── */
function getGL(isa){
  var items=sMap[isa]||[];
  if(!items.length)return '\u2014';
  var counts={};
  items.forEach(function(it){var g=it.g||'';counts[g]=(counts[g]||0)+(it.u||1);});
  var best='',bestC=0;
  Object.keys(counts).forEach(function(g){if(counts[g]>bestC){bestC=counts[g];best=g;}});
  return best?best.replace('gl_',''):'\u2014';
}

/* ─── Auto-refresh State ─── */
var _autoRefresh=true;
var _refreshInterval=15;
var _refreshTimer=null;
var _countdownTimer=null;
var _nextRefresh=0;
(function(){try{var c=localStorage.getItem('dt_autorefresh');if(c){var o=JSON.parse(c);_autoRefresh=o.on!==false;_refreshInterval=o.min||15;}}catch(e){}})();
function saveRefreshConfig(){try{localStorage.setItem('dt_autorefresh',JSON.stringify({on:_autoRefresh,min:_refreshInterval}));}catch(e){}}
function startAutoRefresh(){
  clearInterval(_refreshTimer);clearInterval(_countdownTimer);
  if(!_autoRefresh)return;
  _nextRefresh=Date.now()+_refreshInterval*60000;
  _refreshTimer=setInterval(function(){location.reload();},_refreshInterval*60000);
  _countdownTimer=setInterval(updateCountdown,1000);
  updateRefreshUI();
}
function updateCountdown(){
  var r=Math.max(0,Math.round((_nextRefresh-Date.now())/1000));
  var m=Math.floor(r/60),s=r%60;
  var el=document.getElementById('countdown');
  if(el)el.textContent=m+':'+(s<10?'0':'')+s;
}
function toggleAutoRefresh(){
  _autoRefresh=!_autoRefresh;saveRefreshConfig();
  if(_autoRefresh)startAutoRefresh();
  else{clearInterval(_refreshTimer);clearInterval(_countdownTimer);}
  updateRefreshUI();
}
function updateRefreshUI(){
  var badge=document.getElementById('arBadge');
  if(badge)badge.innerHTML=_autoRefresh?'<span class="live-badge">\u{1f7e2} Auto</span>':'<span class="paused-badge">\u23f8\ufe0f Pause</span>';
  var cd=document.getElementById('countdown');
  if(cd)cd.style.display=_autoRefresh?'':'none';
}
function doRefresh(){
  var el=document.getElementById('lastRefresh');
  if(el)el.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  location.reload();
}

/* ─── Utility Functions ─── */
function num(n){return n==null||n===''?'\u2014':typeof n==='number'?n.toLocaleString('pt-BR'):n;}
function pct(n,d){return d?((n/d)*100).toFixed(1)+'%':'\u2014';}
function fmtD(s){if(!s||s==='null')return '\u2014';return s.split(' ')[0].substring(5).replace(/-/g,'-');}
function fmtT(s){if(!s||s==='null')return '\u2014';var p=s.split(' ');return p[1]?p[1].substring(0,5):'\u2014';}
function dk(s){if(!s||s==='null')return '';return s.split(' ')[0];}
function dn(k){var d=new Date(k+'T12:00:00');return['Dom','Seg','Ter','Qua','Qui','Sex','Sab'][d.getDay()];}
function dp(r){if(r.st==='CLOSED')return '\u2014';if(!r.ai||r.ai==='null')return '\u2014';var d=new Date(r.ai.replace(' ','T'));var diff=Math.ceil((d-new Date())/(864e5));return diff>=0?diff+'d':'\u2014';}
function sb(st){return '<span class="badge st-'+st+'">'+st.replace('ARRIVAL_','')+'</span>';}
function pb(po){return '<span class="badge po-'+(po||'')+'">'+((po||'\u2014'))+'</span>';}
function vn(v){return (!v||v==='null'||v==='')?'\u2014':v;}
function fd(){return D.filter(function(r){return r.fc===FC;});}
function getToday(data){
  if(!data||!data.length)return new Date().toISOString().split('T')[0];
  var dates=data.map(function(r){return dk(r.ai);}).filter(Boolean).sort();
  return dates.length?dates[dates.length-1]:new Date().toISOString().split('T')[0];
}

/* ─── Vendor Risk Score ─── */
var _vendorScores={};
function computeVendorScores(data){
  var vg={};
  data.forEach(function(r){
    var v=vn(r.v)==='\u2014'?'(TRANSSHIP)':r.v;
    if(!vg[v])vg[v]={c:0,p:0,t:[],am:0};
    vg[v].c++;
    if(r.po==='Pontual')vg[v].p++;
    if(r.th>0)vg[v].t.push(r.th);
    if(r.po==='Atraso motorista')vg[v].am++;
  });
  var maxTat=0;
  Object.keys(vg).forEach(function(v){
    var avg=vg[v].t.length?vg[v].t.reduce(function(s,x){return s+x;},0)/vg[v].t.length:0;
    if(avg>maxTat)maxTat=avg;
  });
  if(maxTat===0)maxTat=1;
  _vendorScores={};
  Object.keys(vg).forEach(function(v){
    var g=vg[v];
    var pontRate=g.c?g.p/g.c:0;
    var avgT=g.t.length?g.t.reduce(function(s,x){return s+x;},0)/g.t.length:0;
    var amRate=g.c?g.am/g.c:0;
    var score=pontRate*0.6+(1-avgT/maxTat)*0.25+(1-amRate)*0.15;
    score=Math.max(0,Math.min(1,score));
    var grade=score>=.9?'A':score>=.75?'B':score>=.6?'C':score>=.4?'D':score>=.2?'E':'F';
    _vendorScores[v]={score:score,grade:grade,pct:Math.round(score*100)};
  });
}
function vsb(v){
  var vk=vn(v)==='\u2014'?'(TRANSSHIP)':v;
  var s=_vendorScores[vk];
  if(!s)return '';
  return ' <span class="vs-'+s.grade+'">'+s.grade+'</span>';
}

/* ─── No-Show Detection ─── */
function getNoShows(data){
  var now=new Date();
  var today=getToday(data);
  return data.filter(function(r){
    if(dk(r.ai)!==today)return false;
    if(r.st==='CLOSED'||r.ar)return false;
    if(!r.ai)return false;
    var sched=new Date(r.ai.replace(' ','T'));
    return now>sched;
  }).map(function(r){
    var sched=new Date(r.ai.replace(' ','T'));
    var mins=Math.round((new Date()-sched)/60000);
    r._lateMin=mins;
    return r;
  });
}

/* ─── Projection ─── */
function getProjection(r,data){
  if(r.st==='CLOSED'||r.st==='ARRIVAL_SCHEDULED')return '';
  var v=vn(r.v)==='\u2014'?'(TRANSSHIP)':r.v;
  var vd=data.filter(function(x){return (vn(x.v)==='\u2014'?'(TRANSSHIP)':x.v)===v&&x.st==='CLOSED'&&x.th>0;});
  var avgTat=vd.length?vd.reduce(function(s,x){return s+x.th;},0)/vd.length:0.5;
  var base=r.ck||r.ar||r.ai;
  if(!base)return '';
  var t=new Date(base.replace(' ','T'));
  t.setMinutes(t.getMinutes()+avgTat*60);
  return t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

var _dayFilter=null;

function buildDayPicker(){
  var strip=document.getElementById('dayStripScroll');
  if(!strip)return;
  /* Remove old day cards (keep TODOS button) */
  var old=strip.querySelectorAll('.day-card');
  old.forEach(function(c){c.remove();});

  var data=fd(); /* all data for current FC */
  /* Build map of date -> ISA count + pontualidade */
  var dateMap={};
  data.forEach(function(r){
    var k=dk(r.ai);if(!k)return;
    if(!dateMap[k])dateMap[k]={count:0,pont:0,total:0,crit:0};
    dateMap[k].count++;
    dateMap[k].total++;
    if(r.po==='Pontual')dateMap[k].pont++;
    if(r.th&&r.th>_metas.tat*2)dateMap[k].crit++;
  });

  /* Generate ±7 days from today (BRT) */
  var now=new Date();
  var brt=new Date(now.getTime()-3*60*60*1000);
  var todayStr=brt.toISOString().split('T')[0];
  var days=[];
  for(var i=-7;i<=7;i++){
    var d=new Date(brt);
    d.setDate(d.getDate()+i);
    var key=d.toISOString().split('T')[0];
    days.push({key:key,date:d,offset:i});
  }

  var todayCardEl=null;
  days.forEach(function(day){
    var card=document.createElement('div');
    card.className='day-card';
    var isFuture=day.offset>0;
    var isToday=day.key===todayStr;
    if(isToday)card.classList.add('today');
    if(isFuture)card.classList.add('future');

/* ─── Heatmap builder ─── */
function buildHeatmap(data,today){
  var hm={};
  for(var i=6;i<=29;i++){var hr=i%24;hm[hr]={a:0,ar:0,cl:0};}
  data.filter(function(r){return dk(r.ai)===today;}).forEach(function(r){
    var h;
    h=getHourMin(r.ai);if(h>=0)hm[Math.floor(h/60)%24]=(hm[Math.floor(h/60)%24]||{a:0,ar:0,cl:0}),hm[Math.floor(h/60)%24].a+=(r.un||0);
    h=getHourMin(r.ar);if(h>=0&&hm[Math.floor(h/60)%24])hm[Math.floor(h/60)%24].ar+=(r.un||0);
    h=getHourMin(r.cl);if(h>=0&&hm[Math.floor(h/60)%24])hm[Math.floor(h/60)%24].cl+=(r.un||0);
  });
  var maxV=1;Object.keys(hm).forEach(function(k){maxV=Math.max(maxV,hm[k].a,hm[k].ar,hm[k].cl);});
  var html='<div class="heatmap"><div class="hm-header">Hora</div><div class="hm-header">Agendado</div><div class="hm-header">Arrived</div><div class="hm-header">Closed</div>';
  for(var i=6;i<=29;i++){
    var hr=i%24;var d=hm[hr]||{a:0,ar:0,cl:0};
    html+='<div class="hm-label">'+(hr<10?'0':'')+hr+':00</div>';
    ['a','ar','cl'].forEach(function(k){
      var v=d[k];var intensity=Math.round((v/maxV)*100);
      var bg=v?'rgba(255,153,0,'+(0.1+intensity/120)+')':'transparent';
      html+='<div class="hm-cell" style="background:'+bg+'">'+(v?num(v):'')+'</div>';
    });
  }
  html+='</div>';
  return html;
}

/* ─── Gantt Timeline builder ─── */
function buildGantt(data,today){
  var td=data.filter(function(r){return dk(r.ai)===today;});
  if(!td.length)return '';
  var h='<div class="gantt-wrap"><b style="color:#ff9900;font-size:.82rem">\ud83d\udcc5 Timeline da Doca</b>';
  h+='<div class="gantt-hours">';for(var i=6;i<=23;i++)h+='<span>'+(i<10?'0':'')+i+'</span>';h+='</div>';
  var startMin=6*60,endMin=24*60;var range=endMin-startMin;
  td.sort(function(a,b){return (getHourMin(a.ai)||0)-(getHourMin(b.ai)||0);});
  td.forEach(function(r){
    var label=getDoca(r.i)||(vn(r.v)!=='\u2014'?r.v.substring(0,8):r.i.substring(r.i.length-4));
    var s=getHourMin(r.ai),e=r.cl?getHourMin(r.cl):(r.ck?getHourMin(r.ck):getHourMin(r.ar));
    if(s<0)s=startMin;if(!e||e<0)e=s+30;
    var left=Math.max(0,((s-startMin)/range)*100);
    var width=Math.max(2,((e-s)/range)*100);
    var color=r.st==='CLOSED'?'#4caf50':r.st==='CHECK_IN'?'#42a5f5':r.st==='ARRIVED'?'#ff9800':'#9c27b0';
    h+='<div class="gantt-row"><span class="gantt-label" title="'+r.i+'">'+label+'</span>';
    h+='<div class="gantt-track"><div class="gantt-bar" style="left:'+left+'%;width:'+width+'%;background:'+color+'" title="'+r.i+' '+fmtT(r.ai)+'-'+(r.cl?fmtT(r.cl):'?')+'">'+num(r.un)+'</div></div></div>';
  });
  h+='</div>';
  return h;
}

/* ─── Handoff Report ─── */
function genHandoff(data){
  var today=getToday(data);
  var td=data.filter(function(r){return dk(r.ai)===today;});
  var checkin=td.filter(function(r){return r.st==='CHECK_IN';});
  var arrived=td.filter(function(r){return r.st==='ARRIVED';});
  var noShows=getNoShows(data);
  var next2h=td.filter(function(r){
    if(r.st!=='ARRIVAL_SCHEDULED')return false;
    var m=getHourMin(r.ai);var now=new Date().getHours()*60+new Date().getMinutes();
    return m>=now&&m<=now+120;
  });
  var flagged=td.filter(function(r){return getFlag(r.i);});
  var pendUnits=td.filter(function(r){return r.st!=='CLOSED';}).reduce(function(s,r){return s+(r.un||0);},0);
  var t='*\ud83d\udccb HANDOFF REPORT '+FC+' \u2014 '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'*\n\n';
  t+='\ud83d\udce6 Units pendentes: '+num(pendUnits)+'\n\n';
  t+='*CHECK_IN ('+checkin.length+'):*\n';
  checkin.forEach(function(r){var mins=r.ck?Math.round((new Date()-new Date(r.ck.replace(' ','T')))/60000):'?';t+='\u2022 '+r.i+' '+vn(r.v)+' \u2014 '+num(r.un)+' un (h\u00e1 '+mins+'min)\n';});
  t+='\n*ARRIVED ('+arrived.length+'):*\n';
  arrived.forEach(function(r){t+='\u2022 '+r.i+' '+vn(r.v)+' \u2014 '+num(r.un)+' un\n';});
  t+='\n*PR\u00d3XIMAS 2H ('+next2h.length+'):*\n';
  next2h.forEach(function(r){t+='\u2022 '+r.i+' '+vn(r.v)+' '+fmtT(r.ai)+' \u2014 '+num(r.un)+' un\n';});
  if(noShows.length){t+='\n*\ud83d\udea8 NO-SHOWS ('+noShows.length+'):*\n';noShows.forEach(function(r){t+='\u2022 '+r.i+' '+vn(r.v)+' +'+r._lateMin+'min \u2014 '+num(r.un)+' un\n';});}
  if(flagged.length){t+='\n*\ud83d\udea9 ESCALADOS ('+flagged.length+'):*\n';flagged.forEach(function(r){var f=getFlag(r.i);t+='\u2022 '+r.i+' \u2014 '+f.reason+(f.note?' ('+f.note+')':'')+'\n';});}
  return t;
}

/* ─── WoW Comparison ─── */
function buildWoW(data){
  var todayStr=getToday(data);
  var today=new Date(todayStr+'T12:00:00');
  var thisWeekStart=new Date(today);var _dow=today.getDay();thisWeekStart.setDate(today.getDate()-(_dow===0?6:_dow-1));
  var lastWeekStart=new Date(thisWeekStart);lastWeekStart.setDate(lastWeekStart.getDate()-7);
  var lastWeekEnd=new Date(thisWeekStart);lastWeekEnd.setDate(lastWeekEnd.getDate()-1);
  function weekData(start,end){
    return data.filter(function(r){var d=dk(r.ai);return d>=start.toISOString().split('T')[0]&&d<=end.toISOString().split('T')[0];});
  }
  var tw=weekData(thisWeekStart,today);
  var lw=weekData(lastWeekStart,lastWeekEnd);
  function metrics(d){
    var cl=d.filter(function(r){return r.st==='CLOSED'&&r.th>0;});
    return {
      isas:d.length,
      units:d.reduce(function(s,r){return s+(r.un||0);},0),
      tat:cl.length?cl.reduce(function(s,r){return s+r.th;},0)/cl.length:0,
      pont:d.length?d.filter(function(r){return r.po==='Pontual';}).length/d.length*100:0,
      adoca:d.length?d.filter(function(r){return r.po==='Atraso doca';}).length/d.length*100:0,
      amot:d.length?d.filter(function(r){return r.po==='Atraso motorista';}).length/d.length*100:0
    };
  }
  var m1=metrics(lw),m2=metrics(tw);
  function delta(a,b,invert){
    var d=b-a;var cls=d===0?'delta-neutral':(invert?(d>0?'delta-neg':'delta-pos'):(d>0?'delta-pos':'delta-neg'));
    return '<span class="'+cls+'">'+(d>0?'+':'')+d.toFixed(1)+'</span>';
  }
  var h='<table class="wow-table"><thead><tr><th>M\u00e9trica</th><th>Semana Ant.</th><th>Semana Atual</th><th>\u0394 Delta</th></tr></thead><tbody>';
  h+='<tr><td>Total ISAs</td><td>'+m1.isas+'</td><td>'+m2.isas+'</td><td>'+delta(m1.isas,m2.isas,false)+'</td></tr>';
  h+='<tr><td>Total Units</td><td>'+num(m1.units)+'</td><td>'+num(m2.units)+'</td><td>'+delta(m1.units,m2.units,false)+'</td></tr>';
  h+='<tr><td>TAT M\u00e9dio</td><td>'+m1.tat.toFixed(2)+'h</td><td>'+m2.tat.toFixed(2)+'h</td><td>'+delta(m1.tat,m2.tat,true)+'</td></tr>';
  h+='<tr><td>Pontualidade %</td><td>'+m1.pont.toFixed(1)+'%</td><td>'+m2.pont.toFixed(1)+'%</td><td>'+delta(m1.pont,m2.pont,false)+'</td></tr>';
  h+='<tr><td>Atraso Doca %</td><td>'+m1.adoca.toFixed(1)+'%</td><td>'+m2.adoca.toFixed(1)+'%</td><td>'+delta(m1.adoca,m2.adoca,true)+'</td></tr>';
  h+='<tr><td>Atraso Motorista %</td><td>'+m1.amot.toFixed(1)+'%</td><td>'+m2.amot.toFixed(1)+'%</td><td>'+delta(m1.amot,m2.amot,true)+'</td></tr>';
  h+='</tbody></table>';
  return h;
}

function buildDockUtil(td){

/* ─── v8.0: EOS PNG Export ─── */
function exportEOSPng(){
  try{
  var panel=document.getElementById('p5');
  if(!panel){showToast('Painel EOS não encontrado');return;}
  // Check if html2canvas is loaded
  if(typeof html2canvas==='function'){_captureEOS(panel);return;}
  // Load html2canvas dynamically
  showToast('Carregando...');
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=function(){_captureEOS(panel);};
  s.onerror=function(){
    // Fallback: use native canvas approach
    _captureEOSNative(panel);
  };
  document.head.appendChild(s);
  }catch(e){showToast('Erro ao exportar PNG');console.warn('exportEOSPng:',e);}
}
function _captureEOS(panel){
  try{
  html2canvas(panel,{
    backgroundColor:'#0d1117',
    scale:2,
    useCORS:true,
    logging:false,
    windowWidth:panel.scrollWidth,
    windowHeight:panel.scrollHeight
  }).then(function(canvas){
    var link=document.createElement('a');
    link.download='EOS_'+FC+'_'+getToday(fd()).replace(/-/g,'')+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    showToast('PNG exportado! \u2705');
  }).catch(function(e){
    console.warn('html2canvas error:',e);
    showToast('Erro na captura PNG');
  });
  }catch(e){showToast('Erro: '+e.message);}
}
function _captureEOSNative(panel){
  try{
  // Fallback: create a simple text-based PNG notification
  showToast('html2canvas indisponível - use Print Screen ou Ctrl+Shift+S');
  }catch(e){}
}

/* ─── SMARTER AI PROCESSING ─── */
function aiProcess(q,data){
  var ql=q.toLowerCase();
  
  // ISA number lookup
  var isaMatch=q.match(/\d{12,}/);
  if(isaMatch){
    var isa=isaMatch[0];
    var r=data.find(function(x){return x.i===isa;})||D.find(function(x){return x.i===isa;});
    if(r)return aiISADetail(r,data);
    return '\u274c ISA <b>'+isa+'</b> n\u00e3o encontrada.';
  }
  
  // Vendor name lookup
  var vendors={};data.forEach(function(r){var v=vn(r.v);if(v!=='\u2014')vendors[v.toLowerCase()]=v;});
  var foundVendor=null;
  Object.keys(vendors).forEach(function(vl){if(ql.indexOf(vl)>=0)foundVendor=vendors[vl];});
  if(foundVendor)return aiVendorAnalysis(foundVendor,data);
  
  // SMART DATA QUERIES - v7.4 enhancement
  if(ql.indexOf('maior tat')>=0||ql.indexOf('maior turnaround')>=0||ql.indexOf('pior tat')>=0||ql.indexOf('highest tat')>=0){
    return aiQueryTopTAT(data,'desc');
  }
  if(ql.indexOf('menor tat')>=0||ql.indexOf('melhor tat')>=0||ql.indexOf('fastest')>=0||ql.indexOf('mais r\u00e1pido')>=0){
    return aiQueryTopTAT(data,'asc');
  }
  if(ql.indexOf('m\u00e9dia')>=0&&(ql.indexOf('tat')>=0||ql.indexOf('turnaround')>=0)){
    return aiQueryAvgTAT(q,data);
  }
  if(ql.indexOf('mais atraso')>=0||ql.indexOf('mais atrasado')>=0||ql.indexOf('piores vendor')>=0){
    return aiQueryWorstVendors(data);
  }
  if(ql.indexOf('quantas')>=0||ql.indexOf('quantos')>=0||ql.indexOf('total')>=0){
    return aiQueryCounts(q,data);
  }
  if(ql.indexOf('units')>=0||ql.indexOf('unidades')>=0||ql.indexOf('volume')>=0){
    return aiQueryVolume(q,data);
  }
  
  // Keyword-based responses
  if(ql.indexOf('hoje')>=0||ql.indexOf('resumo')>=0||ql.indexOf('como est')>=0)return aiSummaryToday(data);
  if(ql.indexOf('alerta')>=0||ql.indexOf('no show')>=0||ql.indexOf('noshow')>=0)return aiAlerts(data);
  if(ql.indexOf('tend')>=0||ql.indexOf('trend')>=0)return aiTrends(data);
  if(ql.indexOf('vendor')>=0||ql.indexOf('fornecedor')>=0||ql.indexOf('ranking')>=0)return aiTopVendors(data);
  if(ql.indexOf('risco')>=0)return aiRisks(data);
  if(ql.indexOf('handoff')>=0||ql.indexOf('troca')>=0)return aiHandoff(data);
  if(ql.indexOf('meta')>=0||ql.indexOf('target')>=0)return aiMetas(data);
  if(ql.indexOf('tat')>=0)return '\u{1f4ca} '+DOCK_KNOWLEDGE.tat_benchmark+'<br><br>'+aiTATStats(data);
  if(ql.indexOf('pontualidade')>=0||ql.indexOf('pont')>=0)return DOCK_KNOWLEDGE.pontualidade+'<br><br>'+aiPontStats(data);
  if(ql.indexOf('procedimento')>=0||ql.indexOf('processo')>=0||ql.indexOf('fluxo')>=0)return DOCK_KNOWLEDGE.procedimento;
  if(ql.indexOf('carp')>=0||ql.indexOf('transship')>=0)return DOCK_KNOWLEDGE.carp_transship;
  if(ql.indexOf('eos')>=0)return DOCK_KNOWLEDGE.eos;
  if(ql.indexOf('seguran')>=0)return DOCK_KNOWLEDGE.safety;
  if(ql.indexOf('semana')>=0||ql.indexOf('compara')>=0)return '<b>\ud83d\udcc8 Compara\u00e7\u00e3o Semanal</b><br>'+buildWoW(data);
  
  return '\ud83e\udd14 N\u00e3o encontrei resposta espec\u00edfica. Tente:<br>\u2022 Um <b>ISA ID</b> (ex: 148820015591)<br>\u2022 Um <b>vendor</b> (ex: WC9GD)<br>\u2022 "Qual ISA teve o <b>maior TAT</b>?"<br>\u2022 "M\u00e9dia de <b>TAT</b> nos \u00faltimos 3 dias"<br>\u2022 "Vendors com mais <b>atrasos</b>"';
}

/* ─── SMART DATA QUERY FUNCTIONS (v7.4) ─── */
function aiQueryTopTAT(data,dir){
  var cl=data.filter(function(r){return r.st==='CLOSED'&&r.th>0;});
  if(!cl.length)return 'Sem dados de TAT fechados.';
  cl.sort(function(a,b){return dir==='desc'?b.th-a.th:a.th-b.th;});
  var top=cl.slice(0,10);
  var label=dir==='desc'?'\u{1f4c8} Top 10 Maiores TAT':'\u{1f4c9} Top 10 Menores TAT';
  var h='<b>'+label+'</b><br><table><tr><th>#</th><th>ISA</th><th>Vendor</th><th>TAT</th><th>Units</th><th>Data</th><th>Pont.</th></tr>';
  top.forEach(function(r,i){
    h+='<tr><td>'+(i+1)+'</td><td>'+r.i+'</td><td>'+vn(r.v)+'</td><td><b>'+r.th+'h</b></td><td>'+num(r.un)+'</td><td>'+fmtD(r.ai)+'</td><td>'+pb(r.po)+'</td></tr>';
  });

/* ─── Sparkline (TAT by day, last 7 days) ─── */
function buildSparkline(data){
  var el=document.getElementById('kpiSparkline');if(!el)return;
  var days={};
  data.forEach(function(r){
    if(!r.th||r.th<=0)return;
    var d=dk(r.ai);if(!d)return;
    if(!days[d])days[d]={sum:0,cnt:0};
    days[d].sum+=r.th;days[d].cnt++;
  });
  var sorted=Object.keys(days).sort();
  var last7=sorted.slice(-7);
  if(last7.length<2){el.innerHTML='';return;}
  var avgs=last7.map(function(d){return days[d].sum/days[d].cnt;});
  var max=Math.max.apply(null,avgs)||1;
  var min=Math.min.apply(null,avgs)||0;
  var range=max-min||1;
  var w=120,h=28,pad=4;
  var pts=avgs.map(function(v,i){
    var x=pad+i*(w-2*pad)/(last7.length-1);
    var y=h-pad-(v-min)/range*(h-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var circles=avgs.map(function(v,i){
    var x=pad+i*(w-2*pad)/(last7.length-1);
    var y=h-pad-(v-min)/range*(h-2*pad);
    return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.5" fill="#ff9900"/>';
  }).join('');
  el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'"/>' +circles+'</svg>';
}

/* ─── Sort Enhancement for all tables ─── */
function makeSortable(tableEl){
  if(!tableEl||!tableEl.querySelector)return;
  var headers=tableEl.querySelectorAll('thead th');
  if(!headers.length)return;
  headers.forEach(function(th,colIdx){
    if(th.classList.contains('ms-bound'))return;
    th.classList.add('ms-bound');
    th.style.cursor='pointer';
    th.addEventListener('click',function(){
      var tbody=tableEl.querySelector('tbody');
      if(!tbody)return;
      var allRows=Array.from(tbody.children);
      // Separate data rows from expand rows
      var pairs=[];
      for(var i=0;i<allRows.length;i++){
        var row=allRows[i];
        if(row.classList.contains('xrow'))continue;
        var xrow=allRows[i+1]&&allRows[i+1].classList.contains('xrow')?allRows[i+1]:null;
        pairs.push({data:row,expand:xrow});
      }
      var isAsc=th.getAttribute('data-sort-dir')==='asc';
      headers.forEach(function(h){h.removeAttribute('data-sort-dir');h.querySelectorAll('.sort-arrow').forEach(function(s){s.remove();});});
      th.setAttribute('data-sort-dir',isAsc?'desc':'asc');
      var arrow=document.createElement('span');arrow.className='sort-arrow';arrow.textContent=isAsc?' \u25bc':' \u25b2';
      th.appendChild(arrow);
      pairs.sort(function(a,b){
        var aCell=a.data.cells[colIdx],bCell=b.data.cells[colIdx];
        if(!aCell||!bCell)return 0;
        var aVal=aCell.textContent.trim(),bVal=bCell.textContent.trim();
        var aNum=parseFloat(aVal.replace(/\./g,'').replace(',','.').replace('h',''));
        var bNum=parseFloat(bVal.replace(/\./g,'').replace(',','.').replace('h',''));
        if(!isNaN(aNum)&&!isNaN(bNum))return isAsc?bNum-aNum:aNum-bNum;
        return isAsc?bVal.localeCompare(aVal,'pt-BR'):aVal.localeCompare(bVal,'pt-BR');
      });
      pairs.forEach(function(p){
        tbody.appendChild(p.data);
        if(p.expand)tbody.appendChild(p.expand);
      });
    });
  });
}

/* ─── Vendor Trend Indicator ─── */
function addVendorTrends(){
  var data=turnoFilter(fd());
  var now=new Date();var brt=new Date(now.getTime()-3*3600000);
  var today=brt.toISOString().split('T')[0];
  // Split into recent (last 3 days) vs older
  var dates=data.map(function(r){return dk(r.ai);}).filter(Boolean);
  var unique=Array.from(new Set(dates)).sort();
  if(unique.length<4)return; // not enough data
  var midpoint=unique[Math.floor(unique.length/2)];
  var recent={},older={};
  data.forEach(function(r){
    var d=dk(r.ai);if(!d)return;
    var vk=r.v||'(TRANSSHIP)';
    var bucket=d>=midpoint?recent:older;
    if(!bucket[vk])bucket[vk]={pont:0,total:0};
    bucket[vk].total++;
    if(r.po==='Pontual')bucket[vk].pont++;
  });
  // Return trend data
  var trends={};
  Object.keys(recent).forEach(function(vk){
    var rPct=recent[vk].total?(recent[vk].pont/recent[vk].total*100):0;
    var oPct=older[vk]&&older[vk].total?(older[vk].pont/older[vk].total*100):rPct;
    if(rPct>oPct+5)trends[vk]='up';
    else if(rPct<oPct-5)trends[vk]='down';
    else trends[vk]='flat';
  });
  return trends;
}

function buildVisualWoW(m1,m2){

  ];
  var h='<div class="comp-bars">';
  rows.forEach(function(r){
    var mx=Math.max(r.v1,r.v2,1);

function buildPontDonut(cats,total){
  var colors={'Pontual':'#10b981','Atraso doca':'#f59e0b','Atraso motorista':'#ef4444','Atraso processamento':'#8b5cf6'};
  var r=40,cx=50,cy=50,circ=2*Math.PI*r;
  var offset=0;
  var h='<div class="pont-donut-wrap">';
  h+='<svg viewBox="0 0 100 100" width="130" height="130">';
  var keys=Object.keys(cats);
  keys.forEach(function(k){
    var pct=total?cats[k]/total:0;
    var len=pct*circ;
    var color=colors[k]||'#666';
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(1)+' '+(circ-len).toFixed(1)+'" stroke-dashoffset="'+(-(offset)).toFixed(1)+'" transform="rotate(-90 50 50)"/>';
    offset+=len;
  });
  h+='<text x="50" y="48" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">'+(total?Math.round(cats['Pontual']/total*100):0)+'%</text>';
  h+='<text x="50" y="60" text-anchor="middle" fill="#aaa" font-size="7">Pontual</text>';
  h+='</svg>';
  h+='<div class="pont-donut-legend">';
  keys.forEach(function(k){
    var color=colors[k]||'#666';
    h+='<div><span class="dot" style="background:'+color+'"></span> '+k+': '+cats[k]+' ('+(total?Math.round(cats[k]/total*100):0)+'%)</div>';
  });
  h+='</div></div>';
  // Stacked bar
  h+='<div class="pont-stacked">';
  keys.forEach(function(k){
    var pct=total?cats[k]/total*100:0;
    var color=colors[k]||'#666';
    if(pct>0)h+='<div class="pont-stacked-seg" style="width:'+pct.toFixed(1)+'%;background:'+color+'">'+Math.round(pct)+'%</div>';
  });
  h+='</div>';
  return h;
}

function catMiniBar(count,total,color){
  var pct=total?count/total*100:0;
  return '<span class="cat-mini-bar" style="width:'+Math.max(4,pct).toFixed(0)+'px;background:'+color+'"></span>';
}
